name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Static skill checks
        run: python3 check.py
      - name: Score shop-reply (precomputed with/without)
        run: python3 measurements/score.py
